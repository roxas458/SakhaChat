<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SakhaChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Auth screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-box">
      <h1>🪶 SakhaChat</h1>
      <p class="tagline">Кэпсэтиэх, доҕоттор!</p>
      <div id="login-form">
        <h2>Вход</h2>
        <input type="text" id="login-username" placeholder="Логин" autocomplete="username">
        <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password">
        <button onclick="login()">Войти</button>
        <p class="switch">Нет аккаунта? <a onclick="showRegister()">Регистрация</a></p>
        <p class="error" id="login-error"></p>
      </div>
      <div id="register-form" style="display:none">
        <h2>Регистрация</h2>
        <input type="text" id="reg-username" placeholder="Логин" autocomplete="username">
        <input type="text" id="reg-display" placeholder="Отображаемое имя" autocomplete="name">
        <input type="password" id="reg-password" placeholder="Пароль" autocomplete="new-password">
        <button onclick="register()">Создать</button>
        <p class="switch">Есть аккаунт? <a onclick="showLogin()">Вход</a></p>
        <p class="error" id="reg-error"></p>
      </div>
    </div>
  </div>

  <!-- Chat screen -->
  <div id="chat-screen" class="screen" style="display:none">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="me">
          <div class="avatar" id="me-avatar">?</div>
          <div>
            <div class="name" id="me-name"></div>
            <div class="username" id="me-username"></div>
          </div>
        </div>
        <div class="header-buttons">
          <button class="settings-btn" onclick="openSettings()" title="Настройки">⚙️</button>
          <button class="logout" onclick="logout()" title="Выйти">⎋</button>
        </div>
      </div>
      <input type="text" class="search" id="search" placeholder="Поиск пользователей..." oninput="searchUsers(this.value)">
      <div class="user-list" id="user-list"></div>
    </aside>
    <main class="chat-area">
      <div class="empty-chat" id="empty-chat">
        <div>🪶</div>
        <p>Выберите собеседника</p>
      </div>
      <div class="chat" id="chat" style="display:none">
        <div class="chat-header">
          <button class="back-btn" onclick="closeChatOnMobile()" title="Назад">←</button>
          <div class="avatar" id="chat-avatar"></div>
          <div>
            <div class="name" id="chat-name"></div>
            <div class="status" id="chat-status"></div>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <input type="text" id="message-input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendMessage()" autocomplete="off">
          <button onclick="sendMessage()">➤</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Модалка настроек профиля -->
  <div id="settings-modal" class="modal" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Настройки профиля</h2>
        <button class="modal-close" onclick="closeSettings()" title="Закрыть">✕</button>
      </div>

      <div class="modal-body">
        <!-- Профиль -->
        <div class="profile-section">
          <div class="avatar avatar-large" id="settings-avatar">?</div>
          <div class="profile-info">
            <div class="name" id="settings-username-display"></div>
            <div class="username" id="settings-username"></div>
            <div class="member-since" id="settings-created"></div>
          </div>
        </div>

        <!-- Смена имени -->
        <label class="field-label">Отображаемое имя</label>
        <input type="text" id="settings-displayName" class="modal-input" placeholder="Ваше имя" maxlength="40">
        <p class="field-hint">Как вас будут видеть другие</p>

        <hr class="modal-divider">

        <!-- Смена пароля -->
        <label class="field-label">Смена пароля</label>
        <input type="password" id="settings-currentPassword" class="modal-input" placeholder="Текущий пароль" autocomplete="current-password">
        <input type="password" id="settings-newPassword" class="modal-input" placeholder="Новый пароль (от 4 символов)" autocomplete="new-password">
        <p class="field-hint">Оставьте пустым, если не хотите менять</p>

        <p class="error" id="settings-error"></p>
        <p class="success" id="settings-success"></p>
      </div>

      <div class="modal-footer">
        <button class="btn-secondary" onclick="closeSettings()">Отмена</button>
        <button class="btn-primary" onclick="saveProfile()">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
